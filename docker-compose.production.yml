services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: rentiva_api
    env_file:
      - ./apps/api/.env.production
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: always

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: rentiva_web
    env_file:
      - ./apps/web/.env.production
    ports:
      - "3000:3000"
    restart: always

  postgres:
    image: postgres:16
    container_name: rentiva_postgres
    environment:
      POSTGRES_USER: rentiva
      POSTGRES_PASSWORD: npg_kVbAM16dyIPt
      POSTGRES_DB: rentiva_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data: